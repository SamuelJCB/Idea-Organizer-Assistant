<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Nova · Offline</title>
    <style>
      :root { color-scheme: light dark; --bg: #efeeeb; --fg: #1c1917; --muted: #78716c; }
      @media (prefers-color-scheme: dark) { :root { --bg: #0c0a09; --fg: #fafaf9; --muted: #a8a29e; } }
      body {
        margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 16px;
        background: var(--bg); color: var(--fg); text-align: center;
        font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      h1 { margin: 0 0 4px; font-size: 18px; font-weight: 600; color: var(--muted); }
      p { margin: 0 0 16px; color: var(--muted); }
      button { font: inherit; padding: 8px 16px; border-radius: 10px; border: 0; background: var(--fg); color: var(--bg); }
    </style>
  </head>
  <body>
    <main>
      <h1>Nova</h1>
      <p>You're offline. Nova needs a connection to load your projects.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
